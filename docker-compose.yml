services:
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hospital_management
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./HospitalManagementSystem/HospitalManagementSystem/hms-backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: NexoraHMS
      APP_ENV: local
      APP_KEY: base64:+umExKrLFkxRZYsV/CFR5yKenqHBGHtmnzqsKuSRhD8=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hospital_management
      DB_USERNAME: root
      DB_PASSWORD: password123
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:5174,127.0.0.1:5173,127.0.0.1:5174
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexora-network

  frontend:
    build:
      context: "./nexora hospital/nexora hospital"
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - nexora-network

volumes:
  mysql_data:
    driver: local

networks:
  nexora-network:
    driver: bridge
